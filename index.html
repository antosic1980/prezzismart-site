<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrezziSmart - Le migliori offerte Amazon</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 10px;
            color: #d1d5db;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h2 {
            font-size: 28px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .price {
            font-size: 28px;
            font-weight: bold;
        }

        .old-price {
            color: #888;
            text-decoration: line-through;
        }

        .discount {
            color: #16a34a;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #ff9900;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>🔥 PrezziSmart</h1>
    <p>Le offerte più interessanti, selezionate per te.</p>
</header>

<main>

    <div class="intro">
        <h2>🛒 Offerte del momento</h2>
        <p>Scopri le occasioni che abbiamo trovato.</p>
    </div>

    <div class="card">
        <h2>📦 Prodotto di esempio PrezziSmart</h2>

        <p>
            <span class="old-price">€99,99</span>
        </p>

        <p class="price">€49,99</p>

        <p class="discount">📉 -50%</p>

        <a
            class="button"
            href="https://www.amazon.it/"
            target="_blank"
            rel="noopener noreferrer"
        >
            👉 Vedi l'offerta
        </a>
    </div>

</main>

<footer>
    © 2026 PrezziSmart
</footer>

</body>
</html>
